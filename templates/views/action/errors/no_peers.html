{{ define "main" }}
<div class="mx-5 mt-1 p-4 rounded-xl bg-base-300/20 border border-w-line/40">
    <div class="flex items-start gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="size-5 shrink-0 mt-0.5 text-w-pinkL">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <h3 class="font-semibold text-base text-base-content leading-snug">{{ t $.Lang "action.noPeers.title" }}</h3>
    </div>

    <p class="text-sm text-w-sub mt-3 leading-relaxed">
        {{ t $.Lang "action.noPeers.vaultPitch" }}
    </p>
</div>

<div class="pt-3 px-5 flex flex-wrap gap-2 justify-end items-center">
    <a class="close closeable-close">{{ t $.Lang "action.noPeers.gotIt" }}</a>
</div>
{{ end }}
